{% extends 'base.html' %}

{% block title %}Business Settings{% endblock %}

{% block content %}
<section class="page-shell">
  <div class="card wide-form">
    <h2>Business Settings</h2>
    <form method="post" class="form-grid">
      <div>
        <label>Business Name</label>
        <input type="text" name="name" value="{{ business.name }}" required>
      </div>
      <div>
        <label>Business Type</label>
        <input type="text" name="business_type" value="{{ business.business_type }}">
      </div>
      <div>
        <label>Phone</label>
        <input type="text" name="phone" value="{{ business.phone or '' }}">
      </div>
      <div>
        <label>Email</label>
        <input type="email" name="email" value="{{ business.email or '' }}">
      </div>
      <div class="full-width">
        <label>Address</label>
        <textarea name="address">{{ business.address or '' }}</textarea>
      </div>
      <div>
        <label>Currency</label>
        <input type="text" name="currency" value="{{ business.currency or 'PKR' }}">
      </div>
      <div>
        <label>Tax Rate (%)</label>
        <input type="number" step="0.01" name="tax_rate" value="{{ business.tax_rate or 0 }}">
      </div>
      <div class="full-width">
        <button type="submit" class="button primary">Save Settings</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
